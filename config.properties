# ===========================================
# Distributed System Configuration
# ===========================================

# Worker nodes (comma-separated host:port:weight)
# For single-machine testing, all on localhost with different ports
workers=localhost:8001:1,localhost:8002:1,localhost:8003:1

# Master settings
master.host=localhost
master.port=9000

# --- Task Parameters ---

# Matrix Multiplication
matrix.size=500

# Monte Carlo Pi Estimation
montecarlo.samples=10000000

# Prime Factorization (numbers in 10^6 to 10^9 range — still hard, but won't hang)
prime.count=500
prime.min=1000000
prime.max=999999999

# --- Worker Settings ---
worker.thread.pool.size=4
worker.heartbeat.interval.ms=3000
worker.task.timeout.ms=120000

# --- Chunk Settings ---
# Number of chunks to split work into (higher = finer granularity for load balancing)
chunks.count=12
